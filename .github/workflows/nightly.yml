# Nightly — the storage tests at a scale the pull-request gate cannot afford.
#
# `make soak` runs the recovery tests over ~35 block ranges with the race
# detector on. That combination is not incidental: issue #3 was a query that
# read the blocks before the head and so missed the range a concurrent block
# cut was moving between them, and it reproduced only when the store was slow
# enough for a cut to land inside a single query. CI was about twelve times
# slower than a laptop, which is why it failed there and nowhere else; `-race`
# buys the same pace locally. It is fixed, and
# TestDB_AQueryNeverFallsIntoTheGapBetweenTheHeadAndANewBlock covers it in two
# seconds inside `make ci`.
#
# This stays because the fast test only checks the bug we know about. What
# found #3 was a long query and a block cut overlapping by accident, at a scale
# nothing smaller reaches — the class of bug worth paying a nightly for. A
# failure here is a report, not a blocked branch, which is also why it is not a
# required check: a gate that fails intermittently teaches people to press
# re-run, and the next real failure gets pressed through with it.
name: nightly

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  soak:
    # ubuntu-latest, and here the image is not incidental. This job runs one
    # Go toolchain (pinned by go.mod) and nothing else, so nothing *installed*
    # can drift — but the whole point of the job is that the runner is slower
    # than a laptop, and how much slower is a property of the image. When
    # ubuntu-latest becomes Ubuntu 26 on 2026-10-19, that is the variable
    # changing.
    #
    # Which is a reason to watch it, not to pin it: a soak that only ever runs
    # on one frozen image stops being a sample of what CI actually does. The
    # run currently finishes in about 2.5 minutes against a 40m `go test`
    # timeout, so there is room for the image to get considerably slower
    # before anything is cut off — and if it ever is, that is a finding about
    # the storage engine, which is what this job exists to report.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make soak
