# CI — the backstop (ADR-0013). The primary gate is still the git hooks
# (lefthook.yml): pre-commit runs the fast checks on each commit, pre-push runs
# the full `make ci`. This re-runs `make ci` on every pull request, on a clean
# machine, so a pushed branch is verified by something other than the laptop
# that produced it. The repo is public, so the minutes are free.
#
# Deliberately not here: `make smoke` (needs the compose stack), the crash loop
# and `fuzz-long` (minutes of wall clock). Those are run by hand per milestone.
# Keep it one job — jobs are billed rounded up to a whole minute.
name: ci

on:
  workflow_dispatch:
  pull_request:
    paths-ignore: ["**.md", "docs/**", "LICENSE", ".github/ISSUE_TEMPLATE/**", ".github/PULL_REQUEST_TEMPLATE.md"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.2
      - run: scripts/check-no-app-coupling.sh
      - run: make docs-check
      - run: make test
      - name: web
        working-directory: web
        run: npm ci && npm run typecheck && npm run lint && npm run test:coverage && npm run build
