# Keeps the workflows' actions current, which is the thing that went stale:
# five of them fell far enough behind that GitHub was force-running them on a
# newer Node than they declared, and the warning only surfaced because a CI run
# was being read closely for another reason.
#
# Monthly and grouped into one pull request, because this is a backstop and not
# a product: a stream of individual bumps on a solo repo is noise that teaches
# people to merge without looking. Only the actions are watched — Go modules,
# npm and uv are all pinned deliberately and reviewed as part of the work that
# needs them (AGENTS.md's dependency allowlist).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: chore(ci)
