# agent — reference configuration.
#
# Every setting is listed with its default. Values shown uncommented are the
# ones this file actually sets; commented ones document the default.
#
# Precedence (lowest → highest):
#   built-in defaults < this file < conf.d fragments < environment
#
# conf.d: every *.yaml in `confd_path` is merged over this file in file-name
# order. Maps merge, lists append (so each app's fragment can add its own tags,
# checks and log sources), and a scalar set in two files is an error naming
# both. Per-app settings belong in deploy/agent.d/<app>.yaml, never here.
#
# Environment: any leaf can be overridden as OZY_AGENT_<PATH>, e.g.
# OZY_AGENT_INTAKE_URL=http://ozyd:9400. Lists are comma-separated.
# Unknown OZY_AGENT_* variables are only a warning — the SDKs'
# OZY_AGENT_HOST shares the prefix and must not stop the agent.

http:
  # Listen address for trace intake from SDKs (POST /v1/traces, from M5),
  # /healthz and /debug/vars. The statsd UDP port is configured under
  # statsd: below.
  addr: ":8126"
  # Grace period for in-flight requests after SIGTERM. Must be positive.
  shutdown_timeout: 10s

intake:
  # ozyd's base URL; the forwarder POSTs to /v1/* under it.
  url: http://localhost:9400

statsd:
  # The extended StatsD UDP listener (docs/wire-protocol.md §A).
  enabled: true
  addr: ":8125"
  # Socket receive buffer (SO_RCVBUF), bytes. The kernel buffer absorbs a
  # burst while the readers are busy; when it fills, the kernel drops
  # datagrams silently. The OS may cap it (macOS: kern.ipc.maxsockbuf).
  read_buffer: 4194304
  # Goroutines reading the socket, and parsing what they read.
  readers: 2
  workers: 2
  # Datagrams waiting between readers and workers. When full, new datagrams
  # are dropped and counted (ozy.agent.statsd.packets_dropped) — a
  # reader never blocks.
  queue_size: 1024

aggregator:
  # Bucket width: every metric context becomes one point per interval.
  # Whole seconds.
  flush_interval: 10s
  # How long an idle context is remembered. A counter keeps sending 0 for
  # this long after its last increment (so "no errors" isn't a gap).
  context_expiry: 5m
  # Values kept per histogram/timer/distribution context per bucket; beyond
  # this, a uniform random sample (min, max, count and avg stay exact).
  histogram_max_samples: 10000

forwarder:
  # One POST to ozyd.
  timeout: 10s
  # Compressed payloads held for retry while ozyd is unreachable. When
  # full, the oldest are dropped (ozy.agent.forwarder.dropped). 64 MiB.
  max_queue_bytes: 67108864
  # The final delivery attempt on SIGTERM. Keep http.shutdown_timeout plus
  # this under the container's stop grace period.
  shutdown_timeout: 5s

# Pull-based collectors: things the agent reads on a timer rather than
# receives. Their output goes straight to the forwarder (it is one value per
# series per run already) with the host tag and `tags` added.
collectors:
  # How often a collector runs unless it sets its own interval. Whole seconds,
  # at least 1s: a count's interval is whole seconds on the wire. Each
  # collector starts at a random point in its first interval, so several on
  # the same interval do not all fire together.
  interval: 15s
  # One run of one collector is cancelled after this (and never outlives its
  # interval). What it had read by then is still sent. A timeout is counted
  # in ozy.agent.collector.timeouts, and the failure is logged once, not
  # every run. On SIGTERM a running collector gets 2s to return, alongside
  # http.shutdown_timeout rather than after it, so a slow one costs no extra
  # stop time.
  timeout: 10s

  # The machine the agent runs on (system.*: CPU, load, memory, swap, disks,
  # disk I/O, network, uptime). In compose that is the Docker VM, not the Mac
  # — except network, which is per network namespace: there, system.net.* is
  # the agent container's own traffic (container.net.* has each container's).
  # `make dev` runs the agent natively and reports the Mac.
  host:
    enabled: true
    # 0 means collectors.interval.
    interval: 0s
    # Network interfaces not to report, as regular expressions. The default
    # skips macOS's virtual interfaces (VPN tunnels, AirDrop, the internal
    # Apple Silicon NICs), each worth eight series of near-zero rates, and
    # Docker's on Linux (a randomly named veth per container, and the bridges,
    # whose traffic the real NIC counts already). Setting
    # this replaces the default; conf.d fragments append to it. Set it here,
    # not in the environment, which splits lists on commas and would cut a
    # {m,n} quantifier in two.
    exclude_interfaces:
      - ^(utun|awdl|llw|anpi|gif|stf)[0-9]+$
      - ^(veth[0-9a-f]+|docker0|br-[0-9a-f]+)$

  # Containers, through the Docker daemon's socket (container.*,
  # docker.containers.running), plus its event stream for what polling
  # misses: container.exits and container.lifetime for containers that live
  # a few seconds. Compose mounts the socket read-only (ADR-0028); `make dev`
  # points this at the socket the docker CLI uses.
  docker:
    enabled: true
    socket: /var/run/docker.sock
    # 0 means collectors.interval.
    interval: 0s
    # Stats requests in flight at once: the load one run puts on the daemon.
    # Stats are one-shot (one sample each; CPU % is taken between runs), so
    # a request is quick and a run's length grows only with a busy daemon.
    max_concurrency: 8
    # Rename matching containers (the whole name becomes replace, which may
    # use the match's groups, ${1}) before the name becomes a tag, and drop
    # their container_id: for containers that are many and short-lived by
    # design (a sandbox per job), which would otherwise be a series each.
    # Same-named containers become one series: amounts summed, uptime and
    # memory limit the largest (CPU and rates only over containers seen on
    # the previous run too; docs/metrics-catalog.md). First match wins; conf.d fragments append.
    # This stack's own throwaway containers (make up's socket-group probe,
    # smoke's test containers) keep their names but drop container_id, so
    # each run adds to the same series instead of minting new ones.
    container_name_rewrite:
      - match: ^(ozymandias-gid-probe|ozy-smoke-[a-z]+)$
        replace: ${1}
    # container_name_rewrite:
    #   -
    #     match: ^judge-.*
    #     replace: judge
    # Run checks for containers that ask for them with labels:
    #   ozy.check.<check>.<setting>=<value>
    # e.g. ozy.check.redis.port=6379. In a value, %%host%% is the container's
    # IP address and %%port%% its lowest exposed port. The instance is named
    # <check>:<container name> and tagged like the container's metrics; it
    # stops when the container does. Label settings are strings; each check
    # says which of its settings can be set that way.
    autodiscovery: true

  # Checks: collectors you configure, one per instance. Every instance takes
  # the common settings `name` (instances of one check need distinct names;
  # the collector tag becomes <check>:<name>), `interval` (default
  # collectors.interval) and `tags`, plus the check's own. An unknown check
  # or setting fails startup. conf.d fragments append instances. The shipped
  # checks and their settings are in docs/operations.md.
  checks: {}
  # checks:
  #   http_check:
  #     instances:
  #       - name: home
  #         url: https://example.com/
  #         tags: [team:web]

# Value of the `host` tag on everything this agent sends. Empty means the OS
# hostname — set it explicitly in a container, where that is a random id. The
# same rule as ozyd's `hostname`: a name that cannot be a tag (a comma,
# surrounding whitespace, a trailing ':', over 195 bytes) fails startup
# (exit 2), and so does an empty one when the OS has no usable name (exit 1).
# `make up` and `make dev` set it from scripts/hostname.sh, overriding this.
hostname: ""

# Tags added to everything this agent sends. conf.d fragments append to this
# list. Each is "key:value" or a bare "key".
tags: []
# tags:
#   - env:dev

# Directory of per-app fragments (see the header). Relative to the working
# directory. A missing directory simply means "no fragments". Cannot be set
# from inside a fragment.
confd_path: ./deploy/agent.d

log:
  # debug | info | warn | error
  level: info
  # text | json
  format: text
