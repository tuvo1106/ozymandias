# ozymandias — local stack.  `make up` / `make down` (see Makefile).
#
#   ozyd  UI + API + (from M1) intake, on :9400. State in the named
#              volume `ozymandias-data` (`make down-v` wipes it).
#   agent      per-host collector: trace/health HTTP on :8126, statsd on
#              :8125/udp (listening from M1).
#
# Both join the external network `ozymandias` (created by `make up`), which is
# how instrumented apps' containers reach the agent by name:
# OZY_AGENT_HOST=agent (docs/plan/integrations.md §0).
#
# Colima note: its default ssh port forwarder does NOT forward UDP from the
# Mac into containers, so a host process (e.g. a dev server) can't reach
# :8125/udp here. Run the agent natively (`make dev`) or switch Colima to
# `portForwarder: grpc` — see docs/operations.md.
#
# The agent reads the Docker daemon's socket for container metrics
# (ADR-0028): mounted read-only, and reachable by the non-root agent through
# group_add with the socket's group id, which `make up` looks up. Socket
# access is root-equivalent on the Docker host whatever the mount says:
# ":ro" stops the file being replaced, not API calls through it.

name: ozymandias

services:
  ozyd:
    build:
      context: ..
      args:
        VERSION: ${OZY_VERSION:-dev}
    image: ozymandias:${OZY_VERSION:-dev}
    command: ["-config", "/etc/ozy/ozyd.yaml"]
    environment:
      OZY_LOG_FORMAT: json
      # The host tag on ozyd's own metrics. Unset, it would be the container
      # id, new on every recreate. The same name the agent uses.
      OZY_HOSTNAME: ${OZY_HOSTNAME:-ozymandias-host}
    ports:
      - "9400:9400"
    volumes:
      - ozymandias-data:/data
    healthcheck:
      test: ["CMD", "/usr/local/bin/ozyd", "healthcheck", "-config", "/etc/ozy/ozyd.yaml"]
      interval: 10s
      timeout: 5s
      start_period: 5s
      retries: 3
    # Graceful shutdown gets http.shutdown_timeout (10s); give it a margin
    # before Docker escalates to SIGKILL.
    stop_grace_period: 15s
    networks: [ozymandias]

  agent:
    image: ozymandias:${OZY_VERSION:-dev}
    entrypoint: ["/usr/local/bin/agent"]
    command: ["-config", "/etc/ozy/agent.yaml"]
    environment:
      OZY_AGENT_INTAKE_URL: http://ozyd:9400
      # The container's own hostname is a random id; tag data with the
      # machine's name instead (`make up` exports it).
      OZY_AGENT_HOSTNAME: ${OZY_HOSTNAME:-ozymandias-host}
      OZY_AGENT_LOG_FORMAT: json
    ports:
      - "8126:8126"
      - "8125:8125/udp"
    volumes:
      # Per-app fragments, editable without rebuilding the image.
      - ./agent.d:/etc/ozy/agent.d:ro
      # Where the agent remembers how far it has read each log, so a restart
      # repeats at most one batch and skips nothing.
      - ozymandias-agent-data:/var/lib/ozymandias-agent
      # JSON log files of apps on this host, read-only: drop *.log files in
      # deploy/app-logs/ or point OZY_APP_LOGS at your own directory. Other
      # formats get their own source in agent.d/<app>.yaml (agent.d/README.md).
      - ${OZY_APP_LOGS:-./app-logs}:/var/log/apps:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # The socket is root:<docker group>, mode 660; the agent runs as
    # nonroot. The group's id differs per Docker host (991 under Colima), so
    # `make up` reads it from the socket. 0 without make: root's group, which
    # is the socket's group on hosts that have no docker group.
    group_add:
      - "${OZY_DOCKER_GID:-0}"
    healthcheck:
      test: ["CMD", "/usr/local/bin/agent", "healthcheck", "-config", "/etc/ozy/agent.yaml"]
      interval: 10s
      timeout: 5s
      start_period: 5s
      retries: 3
    stop_grace_period: 15s
    depends_on:
      ozyd:
        condition: service_healthy
    networks: [ozymandias]

volumes:
  ozymandias-data:
  ozymandias-agent-data:

networks:
  ozymandias:
    external: true
