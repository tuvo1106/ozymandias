# ozyd — reference configuration.
#
# Every setting is listed with its default. Values shown uncommented are the
# ones this file actually sets; commented ones document the default.
#
# Precedence (lowest → highest):  built-in defaults < this file < environment.
# Any leaf can be overridden from the environment as OZY_<PATH>, the YAML
# path upper-cased and joined with "_", e.g. OZY_HTTP_ADDR=:9400.
# Lists are comma-separated in the environment.
#
# Unknown keys in this file are an error (a typo must not silently fall back
# to a default). Unknown OZY_* variables are only a warning.
#
# Used as-is by deploy/docker-compose.yml; `make dev` runs with it too.

http:
  # Listen address for everything ozyd serves: intake (/v1/*), the
  # query API (/api/v1/*), /healthz, /debug/vars and the web UI.
  addr: ":9400"
  # How long in-flight requests get to finish after SIGTERM before the
  # remaining connections are cut. Must be positive.
  shutdown_timeout: 10s

# Root of all on-disk state: meta.db (metric types; later dashboards and
# monitors), tsdb/ (the metric store: wal/ and blocks/), and later the log
# store (M4), trace store (M5) and queue (M7). Created at startup if missing;
# must be writable. The container overrides this to /data (a named volume).
data_dir: ./data/ozyd

# Value of the `host` tag on ozyd's own metrics (ozy.*). Empty means the OS
# hostname. Set it to the agent's hostname: in a container the OS hostname is
# a random id, new on every recreate, and on macOS it can be "name.local" or
# whatever the network's DHCP calls the machine. A name that cannot be a tag
# (a comma, surrounding whitespace, a trailing ':', over 195 bytes) fails
# startup (exit 2).
#
# `make up` and `make dev` always set OZY_HOSTNAME (scripts/hostname.sh,
# unless you export it), and the environment beats this file, so under those
# two a value here has no effect: export OZY_HOSTNAME instead.
hostname: ""

storage:
  # Which metric store to run. "tsdb" is the real engine (M2): a write-ahead
  # log, an in-memory head and immutable blocks under data_dir/tsdb/.
  # "naive" is M1's SQLite store in data_dir/metrics-naive.db, kept as the
  # oracle the TSDB's differential tests are held to, and as somewhere to
  # stand if you hit a storage bug.
  metric_store: tsdb

  # How much time one on-disk block covers. Larger means fewer files and
  # better compression; smaller means retention frees disk sooner, because a
  # block is deleted whole or not at all.
  #
  # It also decides how far back a sample may be written: roughly
  # 1.5 x block_range behind a series' newest sample, after which it is
  # refused and counted in ozy.tsdb.ooo_rejected. Shortening this for a
  # test will start rejecting anything backdated. See docs/operations.md.
  # block_range: 2h

  # Blocks whose newest sample is older than this are deleted. A negative
  # value keeps everything.
  # retention: 360h

  # Hard cap on total size under data_dir; the oldest blocks are deleted when
  # it is exceeded. 0 disables it. This is a backstop against a full disk, not
  # a retention policy — it evicts by age with no regard for what the data is,
  # so a cardinality spike can silently cost you history.
  # max_bytes: 0

  # Widest a compacted block may become. Must be at least block_range, or no
  # compaction could ever run.
  # max_block_range: 54h

  # Cardinality limit per metric name. New series beyond it are refused and
  # counted in ozy.tsdb.series_limit_rejected — almost always a tag
  # carrying an unbounded value. Negative means unlimited, which is a decision
  # to make deliberately.
  # max_series_per_metric: 10000

  # fsync the write-ahead log before acknowledging an intake request. On by
  # default: agent batches are large and infrequent, so the fsync is amortized
  # over thousands of samples, and the alternative is telling a client its
  # data is safe before it is.
  # wal_sync_on_append: true

  # Group-commit period when wal_sync_on_append is off: how long an
  # acknowledged sample may sit in the page cache.
  # wal_sync_interval: 100ms

log:
  # ozyd's own log level: debug | info | warn | error
  level: info
  # text (human-readable) | json (for anything that parses it, including
  # ozymandias's own log pipeline from M4)
  format: text

provisioning:
  # Directories of dashboard (M3) and monitor (M6) JSON definitions, upserted
  # by `uid` at startup. Several are allowed, so an app can mount its own
  # directory next to ozymandias's — a later directory wins, which is how an
  # app deliberately overrides a stock dashboard.
  #
  # Only *.json directly in each directory; subdirectories are not scanned, so
  # a work-in-progress can sit next to the real ones. A missing directory is
  # skipped with a log line rather than being an error, and one unreadable file
  # does not stop the others or startup — see docs/api.md#provisioning.
  #
  # The path below is relative to the repo root, for `make dev`. The container
  # bakes the same directory into the image and points here with
  # OZY_PROVISIONING_PATHS=/etc/ozy/dashboards.
  paths:
    - ./deploy/dashboards
  # paths:
  #   - ./deploy/dashboards
  #   - /etc/ozy/dashboards.d   # an app's own, mounted
  #   - ./deploy/monitors

logs:
  # How long a day of logs is kept, counted from the END of that day, so a log
  # lives between this and this + 24h. Negative keeps everything. Zero is
  # rejected (it would read as "off" and mean something else).
  retention: 168h
  # Raw bytes one log query may decompress before it returns what it has so far
  # with a cursor to continue (`truncated: true`). 0 means the store's default
  # (2 GiB). A free-text search with nothing else to narrow it is what hits it.
  # scan_budget: 0
  # Skip fsync: a crash can lose logs ozyd already acknowledged. For benchmarks
  # and throwaway dev stacks, never for data you want back.
  # no_sync: false
  # Most distinct (service, source, host, env, status) combinations. A stream
  # costs a catalog row, a head block and an open file, and the labels come from
  # whoever posts logs. Past the limit a new combination is stored under service,
  # source and host "_overflow" and counted in ozy.logstore.streams_folded.
  # max_streams: 5000

traces:
  # How long a trace is kept, counted from the hour it was first seen. Negative
  # keeps everything. Zero is rejected (it would read as "off" and mean
  # something else). Request/error/latency statistics are metrics, kept for
  # storage.retention, not for this.
  retention: 168h
  # Skip fsync: a crash can lose spans ozyd already acknowledged. For
  # benchmarks and throwaway dev stacks, never for data you want back.
  # no_sync: false
